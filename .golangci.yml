version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nakedret
    - nestif
    - prealloc
    - revive
    - unconvert
    - unparam
    - wastedassign
  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 15
    goconst:
      min-len: 3
      min-occurrences: 3
  exclusions:
    rules:
      # Test files may duplicate fixtures, ignore some returns, and use simple
      # literals; these checks add noise without improving test quality.
      - path: _test\.go
        linters:
          - gocognit
          - goconst
          - gocyclo
          - gosec
          - unparam
